apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "seerr.fullname" . }}
  labels:
    {{- include "seerr.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "seerr.fullname" . }}
  selector:
    matchLabels:
      {{- include "seerr.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "seerr.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "seerr.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if and .Values.postgres.enabled .Values.postgres.migration.enabled }}
      initContainers:
        - name: setup-postgres-schema
          {{- if .Values.image.sha }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}@sha256:{{ .Values.image.sha }}"
          {{- else }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "/scripts/setup-schema.sh"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: DB_TYPE
              value: postgres
            - name: DB_NAME
              value: {{ .Values.postgres.db_name }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.db_secret }}
                  key: username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.db_secret }}
                  key: password
            {{- if .Values.postgres.network.db_host }}
            - name: DB_HOST
              value: {{ .Values.postgres.network.db_host }}
            - name: DB_PORT
              value: {{ .Values.postgres.network.db_port | quote }}
            {{- else }}
            - name: DB_SOCKET_PATH
              value: {{ .Values.postgres.socket.db_socket_path }}
            {{- end }}
            {{- if .Values.postgres.ssl.db_use_ssl }}
            - name: DB_USE_SSL
              value: {{ .Values.postgres.ssl.db_use_ssl | quote }}
            {{- end }}
            {{- if .Values.postgres.ssl.db_ssl_reject_unauthorized }}
            - name: DB_SSL_REJECT_UNAUTHORIZED
              value: {{ .Values.postgres.ssl.db_ssl_reject_unauthorized | quote }}
            {{- end }}
            {{- if .Values.postgres.ssl.db_ssl_ca }}
            - name: DB_SSL_CA
              value: {{ .Values.postgres.ssl.db_ssl_ca | quote }}
            {{- end }}
            {{- if .Values.postgres.ssl.db_ssl_ca_file }}
            - name: DB_SSL_CA_FILE
              value: {{ .Values.postgres.ssl.db_ssl_ca_file | quote }}
            {{- end }}
            {{- if .Values.postgres.ssl.db_ssl_key }}
            - name: DB_SSL_KEY
              value: {{ .Values.postgres.ssl.db_ssl_key | quote }}
            {{- end }}
            {{- if .Values.postgres.ssl.db_ssl_key_file }}
            - name: DB_SSL_KEY_FILE
              value: {{ .Values.postgres.ssl.db_ssl_key_file | quote }}
            {{- end }}
            {{- if .Values.postgres.ssl.db_ssl_cert }}
            - name: DB_SSL_CERT
              value: {{ .Values.postgres.ssl.db_ssl_cert | quote }}
            {{- end }}
            {{- if .Values.postgres.ssl.db_ssl_cert_file }}
            - name: DB_SSL_CERT_FILE
              value: {{ .Values.postgres.ssl.db_ssl_cert_file | quote }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: migration-script
              mountPath: /scripts
        - name: migrate-sqlite-to-postgres
          image: "{{ .Values.postgres.migration.image.registry }}/{{ .Values.postgres.migration.image.repository }}:{{ .Values.postgres.migration.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.migration.image.pullPolicy }}
          command: ["/bin/sh", "/scripts/migrate.sh"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.db_secret }}
                  key: username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.db_secret }}
                  key: password
            - name: DB_HOST
              value: {{ .Values.postgres.network.db_host | quote }}
            - name: DB_PORT
              value: {{ .Values.postgres.network.db_port | quote }}
            - name: DB_NAME
              value: {{ .Values.postgres.db_name | quote }}
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: migration-script
              mountPath: /scripts
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.image.sha }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}@sha256:{{ .Values.image.sha }}"
          {{- else }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5055
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            {{- if .Values.probes.livenessProbe.initialDelaySeconds }}
            initialDelaySeconds: {{ .Values.probes.livenessProbe.initialDelaySeconds }}
            {{- end }}
            {{- if .Values.probes.livenessProbe.periodSeconds }}
            periodSeconds: {{ .Values.probes.livenessProbe.periodSeconds }}
            {{- end }}
            {{- if .Values.probes.livenessProbe.timeoutSeconds }}
            timeoutSeconds: {{ .Values.probes.livenessProbe.timeoutSeconds }}
            {{- end }}
            {{- if .Values.probes.livenessProbe.successThreshold }}
            successThreshold: {{ .Values.probes.livenessProbe.successThreshold }}
            {{- end }}
            {{- if .Values.probes.livenessProbe.failureThreshold }}
            failureThreshold: {{ .Values.probes.livenessProbe.failureThreshold }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            {{- if .Values.probes.readinessProbe.initialDelaySeconds }}
            initialDelaySeconds: {{ .Values.probes.readinessProbe.initialDelaySeconds }}
            {{- end }}
            {{- if .Values.probes.readinessProbe.periodSeconds }}
            periodSeconds: {{ .Values.probes.readinessProbe.periodSeconds }}
            {{- end }}
            {{- if .Values.probes.readinessProbe.timeoutSeconds }}
            timeoutSeconds: {{ .Values.probes.readinessProbe.timeoutSeconds }}
            {{- end }}
            {{- if .Values.probes.readinessProbe.successThreshold }}
            successThreshold: {{ .Values.probes.readinessProbe.successThreshold }}
            {{- end }}
            {{- if .Values.probes.readinessProbe.failureThreshold }}
            failureThreshold: {{ .Values.probes.readinessProbe.failureThreshold }}
            {{- end }}
          {{- if .Values.probes.startupProbe }}
          startupProbe:
            {{- toYaml .Values.probes.startupProbe | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
          {{- if .Values.postgres.enabled }}
            - name: DB_TYPE
              value: postgres
            - name: DB_NAME
              value: {{ .Values.postgres.db_name }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.db_secret }}
                  key: username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.db_secret }}
                  key: password
            {{- if .Values.postgres.network.db_host }}
            - name: DB_HOST
              value: {{ .Values.postgres.network.db_host }}
            - name: DB_PORT
              value: {{ .Values.postgres.network.db_port | quote }}
            {{- else }}
            - name: DB_SOCKET_PATH
              value: {{ .Values.postgres.socket.db_socket_path }}
            {{- end }}
            {{- if .Values.postgres.ssl.db_use_ssl }}
            - name: DB_USE_SSL
              value: {{ .Values.postgres.ssl.db_use_ssl | quote }}
            {{- end }}
            {{- if .Values.postgres.ssl.db_ssl_reject_unauthorized }}
            - name: DB_SSL_REJECT_UNAUTHORIZED
              value: {{ .Values.postgres.ssl.db_ssl_reject_unauthorized | quote }}
            {{- end }}
            {{- if .Values.postgres.ssl.db_ssl_ca }}
            - name: DB_SSL_CA
              value: {{ .Values.postgres.ssl.db_ssl_ca | quote }}
            {{- end }}
            {{- if .Values.postgres.ssl.db_ssl_ca_file }}
            - name: DB_SSL_CA_FILE
              value: {{ .Values.postgres.ssl.db_ssl_ca_file | quote }}
            {{- end }}
            {{- if .Values.postgres.ssl.db_ssl_key }}
            - name: DB_SSL_KEY
              value: {{ .Values.postgres.ssl.db_ssl_key | quote }}
            {{- end }}
            {{- if .Values.postgres.ssl.db_ssl_key_file }}
            - name: DB_SSL_KEY_FILE
              value: {{ .Values.postgres.ssl.db_ssl_key_file | quote }}
            {{- end }}
            {{- if .Values.postgres.ssl.db_ssl_cert }}
            - name: DB_SSL_CERT
              value: {{ .Values.postgres.ssl.db_ssl_cert | quote }}
            {{- end }}
            {{- if .Values.postgres.ssl.db_ssl_cert_file }}
            - name: DB_SSL_CERT_FILE
              value: {{ .Values.postgres.ssl.db_ssl_cert_file | quote }}
            {{- end }}
          {{- else }}
            - name: DB_TYPE
              value: sqlite
            {{- with .Values.extraEnv }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/config
          {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: {{ include "seerr.configPersistenceName" . }}
      {{- if and .Values.postgres.enabled .Values.postgres.migration.enabled }}
        - name: migration-script
          configMap:
            name: {{ include "seerr.fullname" . }}-migration
            defaultMode: 0555
      {{- end }}
      {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
