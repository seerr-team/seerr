name: Build Custom Release

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Official release tag to build (e.g., v3.1.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build-custom-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch Official Tag and Merge
        run: |
          git remote add upstream https://github.com/seerr-team/seerr.git
          # Fetch the specific tag typed in the UI
          git fetch upstream tag ${{ inputs.upstream_tag }}

          # Merge release tag into branch
          git merge ${{ inputs.upstream_tag }} --no-edit || echo "Merge conflict detected. Need to resolve manually."

          # Push updated code to branch
          git push origin HEAD

          # Create git tag and push it
          git tag ${{ inputs.upstream_tag }}-custom-webhook
          git push origin ${{ inputs.upstream_tag }}-custom-webhook

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Custom Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ inputs.upstream_tag }}-custom-webhook
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
