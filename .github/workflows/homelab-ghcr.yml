name: Homelab GHCR build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to build
        required: true
        default: develop

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Require GHCR_PAT secret
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          if [ -z "${GHCR_PAT}" ]; then
            echo "::error::Missing repo secret GHCR_PAT. Create a classic PAT with write:packages + repo, then add it at Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref }}

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            COMMIT_TAG=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:homelab-${{ github.sha }}
            ghcr.io/${{ github.repository }}:homelab-latest
          provenance: false
