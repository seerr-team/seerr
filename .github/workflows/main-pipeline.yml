name: Main Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate-and-build:
    name: Validate, Test & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
          run_install: false

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Security Audit (PNPM)
        run: pnpm audit --audit-level=high

      - name: Jules PR Guard (Strict Quality Check)
        if: contains(github.event.pull_request.title, 'Jules') || contains(github.event.pull_request.body, 'Jules')
        run: pnpm type-check

      - name: Lint Code
        run: pnpm run lint --if-present

      - name: Run Unit Tests
        run: pnpm run test --if-present

      - name: Build Production Bundle
        run: pnpm run build --if-present
